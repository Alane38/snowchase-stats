name: ping
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ping
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Relevé complet puis archivage sur la branche data
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          mkdir -p /tmp/out
          if [ -z "$CRON_SECRET" ]; then echo "Secret GitHub CRON_SECRET absent : Settings > Secrets and variables > Actions, même valeur que sur Vercel"; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "https://snowchase-stats.vercel.app/api/snapshot?p=99")
          if [ "$code" = 401 ]; then echo "Refusé (401) : le secret CRON_SECRET de GitHub n'a pas la même valeur que celui de Vercel"; exit 1; fi
          D=$(date -u +%Y-%m-%dT%H-%M)
          curl -sS -f --max-time 60 "https://snowchase-stats.vercel.app/api/public?x=$(date +%s)" -o /tmp/public.json || echo "{}" > /tmp/public.json
          # nombre de parties lu dans l'en-tête de la 1re (« partie 1/14 ») : la liste des requêtes grandit
          np=13
          ok=0
          i=0
          while [ "$i" -lt "$np" ]; do
            got=0
            for a in 1 2; do
              if curl -sS -f --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "https://snowchase-stats.vercel.app/api/snapshot?p=$i&x=$(date +%s)" -o /tmp/out/p$i.txt; then got=1; break; fi
              sleep 20
            done
            if [ "$got" = 1 ]; then
              ok=$((ok+1))
              n=$(head -1 /tmp/out/p$i.txt | sed -n 's#.*partie [0-9]*/\([0-9]*\).*#\1#p')
              [ -n "$n" ] && np=$n
            else echo "partie $i : echec apres 2 essais" > /tmp/out/p$i.txt; fi
            i=$((i+1))
            sleep 20
          done
          echo "parties recues : $ok/$np"
          if [ "$ok" -eq 0 ]; then echo "Aucune partie recue, rien a archiver"; exit 1; fi
          for i in $(seq 0 $((np-1))); do cat /tmp/out/p$i.txt; echo; done > /tmp/snap.txt
          git config user.name "snowchase-bot"
          git config user.email "snowchase-bot@users.noreply.github.com"
          if git fetch origin data; then git checkout -B data origin/data; else git checkout --orphan data; git rm -rf . > /dev/null; fi
          mkdir -p releves
          cp /tmp/snap.txt "releves/$D.txt"
          cp /tmp/public.json "releves/$D-public.json"
          cp /tmp/snap.txt releves/latest.txt
          cp /tmp/public.json releves/latest-public.json
          git add releves
          git commit -m "relevé $D ($ok/$np parties)"
          for a in 1 2 3; do
            git push origin data && break
            git fetch origin data
            git rebase origin/data
          done
          [ "$ok" -ge $((np-2)) ] || { echo "Relevé incomplet ($ok/$np) : archivé mais marqué en échec"; exit 1; }
      - name: Heure des publications du jeu
        # game.updated de Roblox : une ligne par publication dans releves/publications.txt (branche data), pour dater
        # chaque version sur le site. Sans effet sur le relevé si elle échoue
        if: always()
        continue-on-error: true
        run: |
          u=$(curl -sS -f --max-time 30 "https://games.roblox.com/v1/games?universeIds=10767392366" | jq -r '.data[0].updated // empty' | cut -c1-19) || exit 0
          [ -n "$u" ] || { echo "updated absent"; exit 0; }
          u="${u}Z"
          git config user.name "snowchase-bot"
          git config user.email "snowchase-bot@users.noreply.github.com"
          git fetch origin data && git checkout -B data origin/data || exit 0
          mkdir -p releves
          touch releves/publications.txt
          if [ "$(tail -n 1 releves/publications.txt)" = "$u" ]; then echo "pas de nouvelle publication ($u)"; exit 0; fi
          grep -qx "$u" releves/publications.txt && exit 0
          echo "$u" >> releves/publications.txt
          git add releves/publications.txt
          git commit -m "publication du jeu $u"
          for a in 1 2 3; do
            git push origin data && break
            git fetch origin data
            git rebase origin/data
          done
      - name: Export quotidien des sessions (anonymisé)
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$CRON_SECRET" ] || { echo "secret absent, export ignoré"; exit 0; }
          git config user.name "snowchase-bot"
          git config user.email "snowchase-bot@users.noreply.github.com"
          if git fetch origin data; then git checkout -B data origin/data; else git checkout --orphan data; git rm -rf . > /dev/null 2>&1 || true; fi
          mkdir -p sessions
          n=0
          for k in 1 2 3 4 5 6 7; do
            d=$(date -u -d "$k days ago" +%Y-%m-%d)
            [ -f "sessions/$d.json" ] && continue
            if curl -sS -f --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "https://snowchase-stats.vercel.app/api/export?day=$d" -o /tmp/ex.json; then
              if grep -qE '"type"|"s":\[' /tmp/ex.json; then cp /tmp/ex.json "sessions/$d.json"; else echo '{"vide":true}' > "sessions/$d.json"; fi
              n=$((n+1))
            fi
          done
          if [ "$n" -gt 0 ]; then
            git add sessions
            git commit -m "sessions anonymisées ($n jour(s))"
            for a in 1 2 3; do
              git push origin data && break
              git fetch origin data
              git rebase origin/data
            done
          fi
      - name: Santé de la collecte (échec = e-mail GitHub)
        if: always()
        run: |
          curl -sS -f --max-time 60 "https://snowchase-stats.vercel.app/api/live?x=$(date +%s)" -o /tmp/live.json || { echo "API live injoignable"; exit 1; }
          node -e '
            const d=require("/tmp/live.json"),n=Date.now()/1e3,f=d.fresh||{},bad=[];
            if(!f.sample||n-f.sample>3600)bad.push("aucun relevé de serveurs depuis plus d une heure : vérifier cron-job.org");
            if(bad.length){console.log(bad.join("\n"));process.exit(1)}
            console.log("collecte OK")'
