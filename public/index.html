/* ---------- parsing ---------- */

function ingest(T,text){const L=text.split("\n");for(const l of L.slice(1)){const m=l.match(/^(\S+) \[(\w+)(?: par (\w+))?\] (.*)$/);if(!m)continue;const metric=m[1],g=m[2],dim=m[3]||"",body=m[4];

const get=(m,g,d)=>S.series[key(m,g||"OneDay",d)];
const sOf=(m,g)=>{const r=get(m,g);return r&&r.rows[0]};
const conf=p=>{const c=p.filter(x=>x.v!=null&&!x.p);return c.length?c:p.filter(x=>x.v!=null)};

function chart(list,o){o=o||{};const W=640,H=o.h||190,pl=48,pr=10,pt=10,pb=22,wrap=h("div","chart"),fmt=o.fmt||fm;list=list.filter(s=>s.pts.some(p=>p.v!=null));

for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=Y(v);svg.appendChild(sv("line",{x1:pl,x2:W-pr,y1:y,y2:y,"class":"ax"}));const t=sv("text",{x:pl-5,y:y+3,"class":"tx","text-anchor":"end"});t.textContent=fmt(v);svg.appendChild(t)}

svg.appendChild(sv("path",{d:solid.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(""),"class":"ln",stroke:col}));

const e=pp[pp.length-1];svg.appendChild(sv("circle",{cx:e[0],cy:e[1],r:3,fill:col}))});
const vl=sv("line",{y1:pt,y2:H-pb,"class":"ax",visibility:"hidden"});svg.appendChild(vl);const tip=h("div","tip"),ov=sv("rect",{x:pl,y:0,width:W-pl-pr,height:H,fill:"transparent"});svg.appendChild(ov);

function bars(rows,m,top){rows=rows.slice(0,top||10);const tot=rows.reduce((a,x)=>a+x.v,0)||1,mx=rows[0]&&rows[0].v||1,c=h("div");rows.forEach(x=>{const w=h("div","br");w.appendChild(h("span","bl",x.name||x.lab));const b=h("span","bar");b.style.width=Math.max(2,Math.round(x.v/mx*100))+"%";w.appendChild(b);w.appendChild(h("span","bv",fv(m,x.v)+" · "+Math.round(x.v/tot*100)+" %"));c.appendChild(w)});return c}
function table(cols,rows,o){o=o||{};const box=h("div","tbl"),bar=h("div","tb"),q=h("input");q.placeholder="Rechercher…";q.type="search";const ex=h("button","","Exporter CSV"),t=h("table");let sk=o.sort||(cols.find(c=>c.num)||cols[0]).k,asc=false,lim=o.limit||15,text="";
const more=h("button","","Voir tout");
function sorted(){const c=cols.find(x=>x.k===sk),f=rows.filter(r=>!text||cols.some(x=>String((x.f&&!x.raw?x.f(r[x.k],r):r[x.k])==null?"":(x.f&&!x.raw?x.f(r[x.k],r):r[x.k])).toLowerCase().includes(text)));return f.sort((a,b)=>{let x=a[sk],y=b[sk];if(c&&c.num){x=x==null?-Infinity:x;y=y==null?-Infinity:y;return asc?x-y:y-x}return asc?String(x).localeCompare(String(y)):String(y).localeCompare(String(x))})}

function dl_(txt,name,type){const a=h("a");a.href=URL.createObjectURL(new Blob([txt],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function sec(root,t,sub){const s=h("section");s.appendChild(h("h2","",t));if(sub)s.appendChild(h("p","mut",sub));root.appendChild(s);return s}

const none=r=>r.appendChild(h("p","mut","Aucune donnée reçue pour cette section (Roblox n'a rien renvoyé ou la partie n'est pas encore chargée)."));
function cl(m){return{name:mn(m),pts:win((sOf(m)||{pts:[]}).pts)}}
/* ---------- constats automatiques ---------- */
function insights(){const o=[],P=S.per;
const dau=sOf("DailyActiveUsers");if(dau){const c=cmp(dau.pts,P);if(c&&c.d!=null){const p=Math.round(c.d*100);o.push({l:p>15?"good":p<-15?"warn":"",t:"Joueurs actifs : moyenne de "+fm(c.cur)+"/jour sur "+P+" jours, "+(Math.abs(p)<5?"stable":(p>0?"+":"")+p+" %")+" par rapport aux "+P+" jours précédents ("+fm(c.prev)+")."})}else if(dau){o.push({l:"",t:"Dernière valeur confirmée : "+fm(lastV(dau.pts))+" joueurs actifs (historique trop court pour une comparaison)."})}}
["Country","Platform","AgeGroupV2","Gender","AcquisitionSource","IsNewUser"].forEach(d=>{const r=seg("DailyActiveUsers",d);if(!r||r.length<2)return;const t=r.reduce((a,x)=>a+x.v,0);if(t>0&&r[0].v/t>=0.4&&!/^unknown$/i.test(r[0].lab))o.push({l:"",t:Math.round(r[0].v/t*100)+" % des joueurs actifs (7 j) "+(d==="IsNewUser"?"sont des "+lab(d,r[0].lab).toLowerCase():"– "+dn(d).toLowerCase()+" : "+lab(d,r[0].lab))+"."})});

const TABS=[["syn","Synthèse",vSyn],["live","Jeu en direct",vLive],["aud","Audience",vAud],["pub","Pub & acquisition",vPub],["ret","Rétention & engagement",vRet],["tech","Technique",vTech],["his","Historique",vHis],["dat","Données",vDat]];
function render(){const nv=$("#tabs");nv.textContent="";TABS.forEach(t=>{const b=h("button",S.ui.tab===t[0]?"on":"",t[1]);b.onclick=()=>{S.ui.tab=t[0];location.hash=t[0];render()};nv.appendChild(b)});document.querySelectorAll("#per button").forEach(b=>b.className=+b.dataset.v===S.per?"on":"");
const v=$("#view");v.textContent="";if(!Object.keys(S.series).length&&S.ui.tab!=="his"&&S.ui.tab!=="live"){v.appendChild(h("p","mut",S.busy?"Chargement des données…":"Aucune donnée pour l'instant."));return}try{TABS.find(t=>t[0]===S.ui.tab)[2](v)}catch(e){v.appendChild(h("pre","","Erreur d'affichage : "+e))}}
async function load(){if(S.busy)return;S.busy=true;const T={series:{},errs:[]};let head="",n=13,raw="",fail=[];const st=$("#st");
try{for(let i=0;i<n;i++){st.textContent="Chargement partie "+(i+1)+"/"+n+"…";try{const r=await fetch("/api/snapshot?p="+i),t=await r.text();if(!r.ok){fail.push(i+1);if(i===0&&r.status===404)break;continue}const L=t.split("\n");if(!head){head=L[0];const m=L[0].match(/partie \d+\/(\d+)/);n=m?+m[1]:1}raw+=t+"\n";ingest(T,t);S.series=T.series;S.errs=T.errs;S.raw=raw;render()}catch(e){fail.push(i+1)}}}
finally{S.busy=false}S.head=head;st.textContent=(head?head.replace(/ \| partie.*$/,""):"Aucun relevé")+(fail.length?" · parties indisponibles : "+fail.join(", ")+" (réessai au prochain rafraîchissement)":" · "+n+" parties chargées")+" · * = valeur provisoire";render()}
document.querySelectorAll("#per button").forEach(b=>b.onclick=()=>{S.per=+b.dataset.v;render()});$("#rf").onclick=()=>{S.his=null;S.live=null;load()};
