function lagBanner(v){if(S.scope)return;let m="";for(const k in S.series){const x=S.series[k];if(x.gran==="OneDay")x.rows.forEach(r=>r.pts.forEach(p=>{if(/^\d\d-\d\d$/.test(p.t)&&p.v!=null&&p.t>m)m=p.t}))}if(m&&m<START){const d=h("div","pn");d.style.marginBottom="16px";d.appendChild(h("h3","","Les premiers chiffres de la campagne ne sont pas encore publiés"));d.appendChild(h("p","sub","Roblox n'a pas encore publié le 19 octobre : le dernier jour disponible est le "+dl(m)+". Les chiffres de la campagne apparaîtront ici dès leur publication."));const bt=h("button","btn","Voir aussi les jours avant le 19 octobre");bt.onclick=()=>{S.scope=1;S.his=null;render()};d.appendChild(bt);v.appendChild(d)}}
async function fromArchive(){const R="https://raw.githubusercontent.com/"+REPO+"/data/releves/",b="?t="+Math.floor(Date.now()/3e5);let r=await fetch(R+"latest.txt"+b);if(!r.ok){const l=await fetch("https://api.github.com/repos/"+REPO+"/contents/releves?ref=data");if(!l.ok)return null;const A=(await l.json()).filter(x=>/^\d{4}-.*\.txt$/.test(x.name)).sort((a,b)=>a.name<b.name?-1:1);if(!A.length)return null;r=await fetch(R+A[A.length-1].name+b)}if(!r.ok)return null;const t=await r.text();return/ \[\w+/.test(t)?t:null}
async function load(){if(S.busy)return;S.busy=true;let txt=null;try{txt=await fromArchive()}catch(e){}if(txt){const T={series:{},errs:[]};ingest(T,txt);S.series=T.series;S.errs=T.errs;S.raw=txt;$("#st").textContent="Relevé archivé du "+txt.split("\n")[0].replace(/^SNOW CHASE relevé /,"").replace(/ \| partie.*$/,"")+" · lu depuis l'archive";S.busy=false;LAST=Date.now();render();return}S.busy=false;return loadDirect()}
async function loadDirect(){if(S.busy)return;S.busy=true;const T={series:{},errs:[]};let head="",n=13,raw="",fail=[];const st=$("#st"),pg=$("#prog i");
try{for(let i=0;i<n;i++){st.textContent="Chargement "+(i+1)+"/"+n+"…";pg.style.width=(i/n*100)+"%";try{const r=await fetch("/api/snapshot?p="+i),t=await r.text();if(!r.ok){fail.push(i+1);if(i===0&&r.status===404)break;continue}const L=t.split("\n");if(!head){head=L[0];const m=L[0].match(/partie \d+\/(\d+)/);n=m?+m[1]:1}raw+=t+"\n";ingest(T,t);S.series=T.series;S.errs=T.errs;S.raw=raw;render()}catch(e){fail.push(i+1)}}}
finally{S.busy=false;LAST=Date.now()}pg.style.width="0";st.textContent=(head?"Relevé du "+head.replace(/^SNOW CHASE relevé /,"").replace(/ \| partie.*$/,""):"Aucun relevé")+(fail.length?" · parties indisponibles : "+fail.join(", ")+" (réessai au prochain rafraîchissement)":"");render()}
document.querySelectorAll("#scope button").forEach(b=>b.onclick=()=>{S.scope=+b.dataset.v;S.his=null;render()});
$("#rf").onclick=()=>{S.his=null;S.live=null;loadLive();loadAds();loadSess();load()};
let hs=(location.hash||"").slice(1);hs=OLD[hs]||hs;if(TABS.some(t=>t[0]===hs))S.tab=hs;
let LAST=0;const p2=n=>String(n).padStart(2,"0");
function nextTick(){const n=new Date(),t=new Date(n);t.setSeconds(0,0);t.setMinutes(n.getMinutes()<20?20:n.getMinutes()<50?50:80);return t}
let NEXT=nextTick();
function tick(){const left=NEXT-Date.now();if(left<=0){NEXT=nextTick();loadLive();loadAds();loadSess();load();return}const s=Math.ceil(left/1000),d=LAST?new Date(LAST):null;$("#cd").textContent=(d?"Page actualisée à "+p2(d.getHours())+":"+p2(d.getMinutes())+" · ":"")+(S.busy?"chargement en cours · ":"")+"prochaine actualisation automatique dans "+p2(Math.floor(s/60))+":"+p2(s%60)}
buildRail();render();loadLive();loadAds();loadSess();load();tick();setInterval(tick,1000);
