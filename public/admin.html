<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Snow Chase - En direct (privé)</title>
<style>
:root{--bg:#eef3fb;--pn:#fff;--tx:#0e1b33;--mut:#5b6b86;--ln:#dbe4f2;--ac:#2563d9;--ok:#14935a;--wa:#c9740a}
@media(prefers-color-scheme:dark){:root{--bg:#0d1526;--pn:#152038;--tx:#e8eefb;--mut:#92a3c2;--ln:#26355a;--ac:#6ea0ff;--ok:#43c791;--wa:#f0a43c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}h1{font-size:22px;margin:0 0 2px}h2{font-size:16px;margin:28px 0 10px}.sub{color:var(--mut);margin:0 0 14px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.bar input{flex:1;min-width:220px;padding:9px 11px;border:1px solid var(--ln);border-radius:8px;background:var(--pn);color:var(--tx)}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px;display:flex;gap:12px}
.card img,.th{width:64px;height:64px;border-radius:10px;background:var(--bg);flex:none;object-fit:cover}.card b{font-size:15px}.kv{color:var(--mut);font-size:13px;margin-top:3px}.kv span{color:var(--tx)}
table{width:100%;border-collapse:collapse;background:var(--pn);border:1px solid var(--ln);border-radius:12px;overflow:hidden}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);font-size:13px;white-space:nowrap}th{color:var(--mut);font-weight:600}td img{width:28px;height:28px;border-radius:6px;vertical-align:middle;margin-right:8px;background:var(--bg)}
.wrap{overflow-x:auto}.empty{padding:18px;color:var(--mut);background:var(--pn);border:1px dashed var(--ln);border-radius:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}.err{color:var(--wa)}
</style></head><body><main>
<h1>En direct</h1><p class="sub">Vue privée : pseudos, têtes et état des joueurs. Ne pas partager ce lien ni la clé. Actualisation toutes les 20 s ; les données arrivent du jeu avec jusqu'à 1 minute de retard.</p>
<div class="bar"><input id="k" type="password" placeholder="Clé d'accès (CRON_SECRET)" autocomplete="off"><button id="go">Afficher</button><span id="st" class="pill">en attente de clé</span><button id="mg" title="À lancer une seule fois, après avoir branché Upstash Redis" style="background:var(--pn);color:var(--tx);border:1px solid var(--ln)">Importer l'ancien stockage</button></div>
<div id="out"></div>
<script>
document.addEventListener("DOMContentLoaded",()=>{const m=document.getElementById("mg");if(m)m.onclick=async()=>{const k=document.getElementById("k").value||KEY;if(!k)return alert("Entre d'abord la clé");m.disabled=true;try{const r=await fetch("/api/admin?view=migrate",{headers:{"x-key":k}});alert(r.status+" "+(await r.text()).slice(0,600))}catch(e){alert(String(e))}m.disabled=false}});
const $=s=>document.querySelector(s),h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let KEY="",timer=null;try{KEY=sessionStorage.getItem("k")||""}catch(e){}
const fs=s=>s==null?"–":s<60?s+" s":Math.floor(s/60)+" min "+String(Math.round(s%60)).padStart(2,"0")+" s",
tp=t=>new Date(t*1000).toLocaleString("fr-FR",{timeZone:"Europe/Paris",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}),
ago=(n,t)=>fs(Math.max(0,n-t));
function img(u,c){const i=h("img");if(u)i.src=u;i.alt="";i.referrerPolicy="no-referrer";if(c)i.className=c;return i}
function table(cols,rows){const w=h("div","wrap"),t=h("table"),th=h("thead"),tr=h("tr");cols.forEach(c=>tr.appendChild(h("th","",c.t)));th.appendChild(tr);t.appendChild(th);const b=h("tbody");rows.forEach(r=>{const x=h("tr");cols.forEach(c=>{const d=h("td");const v=c.f?c.f(r):r[c.k];if(v&&v.nodeType)d.appendChild(v);else d.textContent=v==null?"–":v;x.appendChild(d)});b.appendChild(x)});t.appendChild(b);w.appendChild(t);return w}
const who=r=>{const s=h("span");s.appendChild(img(r.head));s.appendChild(document.createTextNode((r.dn&&r.dn!==r.name?r.dn+" (@"+r.name+")":r.name)||"?"));return s};
function render(d){const o=$("#out");o.textContent="";
o.appendChild(h("h2","","Serveurs ouverts ("+d.servers.length+")"));
o.appendChild(d.servers.length?table([{t:"Serveur",k:"job"},{t:"Version",k:"v"},{t:"Joueurs",k:"n"},{t:"FPS",k:"fps"},{t:"Mémoire (Mo)",k:"mem"},{t:"Ouvert depuis",f:r=>fs(r.up)},{t:"Dernier signal",f:r=>"il y a "+ago(d.at,r.last)}],d.servers):h("div","empty","Aucun serveur ne signale de joueur pour l'instant."));
o.appendChild(h("h2","","Joueurs en ligne ("+d.online.length+")"));
if(!d.online.length)o.appendChild(h("div","empty","Personne en ligne d'après le logger."));else{const g=h("div","grid");d.online.forEach(p=>{const c=h("div","card");c.appendChild(img(p.head,"th"));const b=h("div");const t=h("b","",(p.dn&&p.dn!==p.name?p.dn:p.name)||"?");b.appendChild(t);b.appendChild(h("span","pill",p.name?"@"+p.name:""));
const kv=(a,v)=>{if(v==null||v==="")return;const x=h("div","kv",a+" : ");x.appendChild(h("span","",v));b.appendChild(x)};
kv("Dans le jeu depuis",fs(d.at-p.since));kv("Serveur",p.job&&p.job.slice(0,8));kv("Ping",p.ping!=null?p.ping+" ms":null);kv("Vie",p.hp!=null?p.hp+" / "+p.mhp:null);kv("Position",p.x!=null?p.x+", "+p.y+", "+p.z:null);kv("Équipe",p.team);kv("Phase",p.ph);kv("Inactif depuis",p.idle!=null?(p.idle<10?"actif":fs(p.idle)):null);kv("Chronologie",p.phs&&p.phs.length?p.phs.map(x=>x.ph+(x.dt!=null?" "+x.dt+" s":"")).join(" → "):null);kv("Appareil",p.dev?p.dev+(p.w?" "+p.w+"×"+p.h:"")+(p.inp?" · "+p.inp:""):null);kv("Pays",p.reg);kv("Compte",p.acct!=null?p.acct+" jours"+(p.prem?" · Premium":""):null);kv("Provenance",p.src==="teleport"?"téléportation":p.src?"directe":null);kv("Morts",p.deaths);
if(p.ls)Object.keys(p.ls).forEach(k=>kv(k,p.ls[k]));c.appendChild(b);g.appendChild(c)});o.appendChild(g)}
o.appendChild(h("h2","","Dernières sessions"));
o.appendChild(d.recent.length?table([{t:"Joueur",f:who},{t:"Entrée",f:r=>tp(r.t)},{t:"Durée",f:r=>fs(r.dur)},{t:"Morts",k:"deaths"},{t:"Pays",k:"reg"},{t:"Âge compte (j)",k:"acct"},{t:"Provenance",f:r=>r.src==="teleport"?"téléportation":r.src?"directe":null},{t:"Serveur",k:"job"}],d.recent):h("div","empty","Aucune session terminée sur la période."));
o.appendChild(h("h2","","Joueurs sur "+d.days.length+" jour(s)"));
o.appendChild(d.players.length?table([{t:"Joueur",f:who},{t:"Visites",k:"visits"},{t:"Temps total",f:r=>fs(r.sec)},{t:"Durée moyenne",f:r=>r.visits?fs(Math.round(r.sec/r.visits)):null},{t:"Morts",k:"deaths"},{t:"Achats",k:"buys"},{t:"Premier passage",f:r=>tp(r.first)},{t:"Dernier",f:r=>tp(r.last)}],d.players):h("div","empty","Aucun joueur."))}
async function pull(){const st=$("#st");try{const r=await fetch("/api/admin?view=live&days=2",{headers:{"x-key":KEY},cache:"no-store"});if(r.status===401){st.textContent="clé refusée";st.className="pill err";clearInterval(timer);timer=null;return}if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();render(d);st.textContent="mis à jour à "+new Date().toLocaleTimeString("fr-FR");st.className="pill"}catch(e){st.textContent="erreur : "+e.message;st.className="pill err"}}
function start(){KEY=$("#k").value.trim()||KEY;if(!KEY)return;try{sessionStorage.setItem("k",KEY)}catch(e){}$("#k").value="";pull();clearInterval(timer);timer=setInterval(pull,20000)}
$("#go").onclick=start;$("#k").addEventListener("keydown",e=>{if(e.key==="Enter")start()});if(KEY){$("#st").textContent="reconnexion…";start()}
</script></main></body></html>
